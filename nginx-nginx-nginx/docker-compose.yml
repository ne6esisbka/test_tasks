# Общие настройки для всех воркеров Nginx (YAML Anchor)
x-nginx-common: &nginx-common
  image: nginx:1.27-alpine
  volumes:
    - ./nginx/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
  networks:
    xffnet:
  # Ограничение ресурсов и логов для каждого Nginx
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 128M
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    image: python:3.12-alpine
    container_name: app
    user: "1000:1000" # ИСПРАВЛЕНО: Безопасный запуск от не-root пользователя
    working_dir: /app
    volumes:
      - ./app:/app:ro
    command: python app.py
    networks:
      xffnet:
        ipv4_address: 172.28.0.100
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lb:
    image: nginx:1.27-alpine
    container_name: lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/nginx.conf:ro
    # ИСПРАВЛЕНО: Оставили простую зависимость, чтобы избежать жестких петель при запуске
    depends_on:
      - app
    networks:
      xffnet:
        ipv4_address: 172.28.0.10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx1:
    <<: *nginx-common
    container_name: nginx1
    environment:
      NEXT_UPSTREAM: nginx2:80
      PUBLIC_ENTRYPOINT: "1"
    depends_on:
      - app
    networks:
      xffnet:
        ipv4_address: 172.28.0.11

  nginx2:
    <<: *nginx-common
    container_name: nginx2
    environment:
      NEXT_UPSTREAM: nginx3:80
      PUBLIC_ENTRYPOINT: "1"
    depends_on:
      - app
    networks:
      xffnet:
        ipv4_address: 172.28.0.12

  nginx3:
    <<: *nginx-common
    container_name: nginx3
    environment:
      NEXT_UPSTREAM: app:8000
      PUBLIC_ENTRYPOINT: "1"
    depends_on:
      - app
    networks:
      xffnet:
        ipv4_address: 172.28.0.13

networks:
  xffnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24