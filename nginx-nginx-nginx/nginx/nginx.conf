events { 
    worker_connections 1024; 
}

http {
    # 1. Блок проверки на доверие (модуль real_ip)
    # Указываем подсеть Docker-сети, которой мы доверяем
    set_real_ip_from  172.28.0.0/24;
    # Ищем реальный IP в заголовке X-Forwarded-For, если пришли из доверенной подсети
    real_ip_header    X-Forwarded-For;
    # Позволяет сохранять всю цепочку прокси
    real_ip_recursive on;

    # 2. Описываем бэкенд по умолчанию (наше приложение)
    # Теперь блок upstream находится на своем месте внутри http
    upstream backend_app {
        server 172.28.0.100:8000;
    }

    # 3. Карта для динамического роутинга (цепочки прокси)
    # Если заголовок X-Next-Proxy пустой — шлем в приложение (backend_app).
    # Если там указан конкретный nginx — шлем на него.
    map $http_x_next_proxy $target_upstream {
        default $http_x_next_proxy;
        ""      "backend_app";
    }

    server {
        listen 80;

        # Настраиваем DNS-резолвер Docker, чтобы Nginx мог 
        # на лету преобразовывать имена контейнеров (nginx1, nginx2) в IP-адреса.
        resolver 127.0.0.11 valid=5s;

        location / {
            # Если запрос пришел НЕ из подсети 172.28.0.0/24 (т.е. снаружи от пользователя),
            # старый (внешний) X-Forwarded-For будет стерт модулем real_ip.
            # Если запрос идет внутри цепочки, модуль real_ip сохранит историю.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Передаем заголовок X-Next-Proxy дальше по цепочке
            proxy_set_header X-Next-Proxy $http_x_next_proxy;
            
            # Проксируем на динамически определенный хост (из карты map)
            proxy_pass http://$target_upstream;

            # Обработка ошибок, если указанный хост недоступен
            proxy_next_upstream error timeout invalid_header http_500 http_502;
        }
    }
}