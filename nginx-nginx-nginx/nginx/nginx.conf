events { 
    worker_connections 1024; 
}

http {
    upstream backend_app {
        server 172.28.0.100:8000;
    }

    # Наша рабочая карта валидации цепочки (работает без изменений)
    map "$realip_remote_addr:$http_x_forwarded_for" $validated_xff {
        ~^172\.28\.0\.(11|12|13):$         $realip_remote_addr;
        ~^172\.28\.0\.(11|12|13):(.+)$     "$http_x_forwarded_for, $realip_remote_addr";
        default                            $realip_remote_addr;
    }

    server {
        listen 80;

        # Базовый роутинг: по умолчанию шлем запрос напрямую в приложение
        location / {
            proxy_set_header X-Forwarded-For $validated_xff;
            proxy_set_header X-Next-Proxy ""; # Очищаем заголовок
            proxy_pass http://backend_app;
        }

        # ИМЕНОВАННЫЕ ЛОКАЦИИ ДЛЯ НАДЕЖНОГО РОУТИНГА БЕЗ БАГОВ ДИНАМИЧЕСКИХ ПЕРЕМЕННЫХ:
        location @to_nginx1 {
            proxy_set_header X-Forwarded-For $validated_xff;
            proxy_set_header X-Next-Proxy "";
            proxy_pass http://172.28.0.11:80;
        }

        location @to_nginx2 {
            proxy_set_header X-Forwarded-For $validated_xff;
            proxy_set_header X-Next-Proxy "";
            proxy_pass http://172.28.0.12:80;
        }

        location @to_nginx3 {
            proxy_set_header X-Forwarded-For $validated_xff;
            proxy_set_header X-Next-Proxy "";
            proxy_pass http://172.28.0.13:80;
        }

        # Блок перенаправления: проверяем заголовок X-Next-Proxy
        # и жестко перекидываем в нужную локацию.
        error_page 418 = @to_nginx1;
        error_page 419 = @to_nginx2;
        error_page 420 = @to_nginx3;

        if ($http_x_next_proxy = "nginx1") { return 418; }
        if ($http_x_next_proxy = "nginx2") { return 419; }
        if ($http_x_next_proxy = "nginx3") { return 420; }
    }
}