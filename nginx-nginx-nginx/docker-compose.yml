services:
  app:
    image: python:3.12-alpine
    container_name: app
    user: "1000:1000" 
    working_dir: /app
    volumes:
      - ./app:/app:ro
    command: python app.py
    networks:
      xffnet:
        ipv4_address: 172.28.0.100
    # Лимиты ресурсов и логов
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Максимум 50% от одного ядра CPU
          memory: 128M       # Максимум 128 МБ оперативной памяти
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Один файл лога не больше 10 Мегабайт
        max-file: "3"        # Хранить не более 3 файлов (старые затираются)

  nginx-1:
    image: nginx:1.27-alpine
    container_name: nginx1 
  
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      xffnet:
        ipv4_address: 172.28.0.11
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-2:
    image: nginx:1.27-alpine
    container_name: nginx2
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      xffnet:
        ipv4_address: 172.28.0.12
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-3:
    image: nginx:1.27-alpine
    container_name: nginx3
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      xffnet:
        ipv4_address: 172.28.0.13
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  xffnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24